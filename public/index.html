<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DH ERROR</title>
<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  width:350px;
  background:#0b0b0b;
  padding:25px;
  border-radius:12px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
}
input{background:#111;color:#fff}
button{background:#fff;color:#000;font-size:16px}
.dark{background:#111;color:#fff}
#code{margin-top:12px;color:#00ff99}
</style>
</head>
<body>

<div class="box">
  <h1>DH ERROR</h1>
  <p>WhatsApp Mini Bot</p>

  <input id="num" placeholder="+91XXXXXXXXXX">
  <button onclick="getCode()">🔑 Get Code</button>

  <div id="code"></div>

  <a href="https://whatsapp.com/channel/0029VbBQQ6v4Y9lenR8ROD3O" target="_blank">
    <button class="dark">📢 Join Channel</button>
  </a>

  <a href="https://chat.whatsapp.com/Hw0JIQgGHco8BL6699CDN" target="_blank">
    <button class="dark">👥 Join Group</button>
  </a>

  <p style="font-size:12px;color:#555">Owner • CK-ERROR</p>
</div>

<script>
async function getCode(){
  const n = document.getElementById("num").value;
  const r = await fetch("/pair?number=" + n);
  document.getElementById("code").innerText = await r.text();
}
</script>

</body>
</html>
