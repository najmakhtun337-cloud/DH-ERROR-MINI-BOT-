<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DH ERROR</title>
<style>
body{
  background:#000;
  font-family:Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  width:360px;
  background:#0b0b0b;
  padding:25px;
  border-radius:14px;
  text-align:center;
}
h1{
  letter-spacing:3px;
  margin-bottom:6px;
}
p{
  color:#aaa;
  font-size:14px;
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:15px;
  background:#111;
  color:#fff;
  font-size:15px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.white{
  background:#fff;
  color:#000;
}
.dark{
  background:#111;
  color:#fff;
}
#code{
  margin-top:15px;
  color:#00ff88;
  font-size:18px;
  word-break:break-all;
}
.footer{
  margin-top:18px;
  font-size:12px;
  color:#555;
}
</style>
</head>
<body>

<div class="card">
  <h1>DH ERROR</h1>
  <p>Get Connected to DH ERROR WhatsApp Bot</p>

  <input id="num" placeholder="+91XXXXXXXXXX">

  <button class="white" onclick="getCode()">🔑 Get Code</button>

  <div id="code"></div>

  <a href="https://whatsapp.com/channel/0029VbBQQ6v4Y9lenR8ROD3O" target="_blank">
    <button class="dark">📢 Join Channel</button>
  </a>

  <a href="https://chat.whatsapp.com/Hw0JIQgGHco8BL6699CDN" target="_blank">
    <button class="dark">👥 Join Group</button>
  </a>

  <div class="footer">Owner • CK-ERROR</div>
</div>

<script>
async function getCode(){
  const num = document.getElementById("num").value;
  if(!num) return alert("Enter WhatsApp number");
  const res = await fetch("/pair?number=" + num);
  const data = await res.text();
  document.getElementById("code").innerText = data;
}
</script>

</body>
</html>
